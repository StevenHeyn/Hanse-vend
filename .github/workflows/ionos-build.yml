name: IONOS deployment package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check generated site
        run: |
          test -s dist/index.html
          test -s dist/impressum.html
          test -s dist/datenschutz.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/media/referenz-1.jpg
          ! grep -R 'raw.githubusercontent.com' dist/assets/*.js
      - uses: actions/upload-artifact@v4
        with:
          name: hanse-vend-ionos-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
